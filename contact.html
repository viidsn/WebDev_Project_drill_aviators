<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="main-header">
    <nav class="nav-menu">
      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <div class="logo">Lucas Travel</div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="trips.html" class="nav-link">Trips</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </div>
    </nav>
  </header>

  <section class="hero hero-contact">
    <div class="hero-content">
      <h1 class="fade-in">Contact Me</h1>
    </div>
  </section>
  <div class="content-section contact-center">
    <p>You can reach me at: <a href="mailto:lucas@example.com">lucastravel@gmail.com</a></p>
    <form id="contact-form" class="enquiry-form contact-form" novalidate aria-labelledby="contact-form-title">
      <h2 id="contact-form-title">Contact</h2>

      <div class="form-row">
        <label for="contact-name">Name</label>
          <input id="contact-name" name="name" type="text" class="form-control" placeholder="Jane Doe" required aria-describedby="contact-name-error">
        <span id="contact-name-error" class="field-error" aria-live="polite"></span>
      </div>

      <div class="form-row">
        <label for="contact-email">Email</label>
          <input id="contact-email" name="email" type="email" class="form-control" placeholder="jane@example.com" required aria-describedby="contact-email-error">
        <span id="contact-email-error" class="field-error" aria-live="polite"></span>
      </div>

      <div class="form-row">
        <label for="contact-phone">Phone Number</label>
          <input id="contact-phone" name="phone" type="tel" class="form-control" placeholder="+44 7700 900000" inputmode="tel" aria-describedby="contact-phone-error">
        <span id="contact-phone-error" class="field-error" aria-live="polite"></span>
      </div>

      <div class="form-row">
        <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" rows="4" class="form-control" placeholder="Hi — I'm planning a 7-day trip to Lisbon..." required aria-describedby="contact-message-error"></textarea>
        <span id="contact-message-error" class="field-error" aria-live="polite"></span>
      </div>

      <div class="form-row">
        <button type="submit" class="button">Send Message</button>
      </div>

      <p id="contact-form-status" class="form-status" aria-live="assertive"></p>
    </form>

    <form id="enquiry-form" class="enquiry-form" novalidate>
      <h2>Trip Enquiry</h2>

      <div class="form-row">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" class="form-control" placeholder="Jane Doe" required>
      </div>

      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" class="form-control" placeholder="jane@example.com" required>
      </div>

      <div class="form-row">
        <label for="destination">Destination</label>
        <input id="destination" name="destination" type="text" class="form-control" required placeholder="Lisbon, Portugal">
      </div>

      <div class="form-row form-grid">
        <div>
          <label for="date-from">From</label>
            <input id="date-from" name="date_from" type="date" class="form-control" placeholder="YYYY-MM-DD">
        </div>
        <div>
          <label for="date-to">To</label>
            <input id="date-to" name="date_to" type="date" class="form-control" placeholder="YYYY-MM-DD">
        </div>
      </div>

      <div class="form-row">
        <label for="travelers">Travelers</label>
          <select id="travelers" name="travelers" class="form-control">
            <option value="" disabled selected>Select number of travelers</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4+</option>
          </select>
      </div>

      <div class="form-row">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" class="form-control" placeholder="Tell me more about your trip"></textarea>
      </div>

      <div class="form-row">
        <button type="submit" class="button">Send Enquiry</button>
      </div>

      <p id="form-status" class="form-status" aria-live="polite"></p>
    </form>

    <div class="social-section">
      <h2>Follow me on social media</h2>
      <div class="social-links">
        <a href="https://www.instagram.com" class="social-link instagram">
          <img src="img/instagram.png" alt="Instagram" width="40" height="30">
          <span>Instagram</span>
        </a>
        <a href="https://youtube.com" class="social-link youtube">
          <img src="img/youtube.png" alt="YouTube" width="30" height="30">
          <span>YouTube</span>
        </a>
        <a href="https://twitter.com" class="social-link twitter">
          <img src="img/twitter.png" alt="Twitter" width="30" height="30">
          <span>Twitter</span>
        </a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    &copy; 2025 Lucas Snow. All rights reserved.
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
